<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Go Audio Stream PoC</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <h2>Testing audio streaming to Go 🎙️</h2>

    <div>
        <label for="userId">👤 User ID: </label>
        <input type="text" id="userId" placeholder="Enter your user ID" value="">
    </div>

    <div>
        <label for="micSelect">🎤 Microphone: </label>
        <select id="micSelect" disabled>
            <option value="">-- loading devices --</option>
        </select>
    </div>

    <div>
        <label for="speakerSelect">🔊 Speaker: </label>
        <select id="speakerSelect" disabled>
            <option value="">-- loading devices --</option>
        </select>
    </div>

    <details id="settingsPanel">
        <summary>⚙️ Audio settings</summary>
        <div class="settings-grid">
            <label for="bitrate">Bitrate</label>
            <select id="bitrate">
                <option value="8000">8 kbps (low)</option>
                <option value="16000">16 kbps</option>
                <option value="32000">32 kbps</option>
                <option value="64000" selected>64 kbps</option>
                <option value="128000">128 kbps (high)</option>
                <option value="256000">256 kbps</option>
            </select>

            <label for="sampleRate">Sample rate</label>
            <select id="sampleRate">
                <option value="8000">8 kHz (phone)</option>
                <option value="16000">16 kHz</option>
                <option value="22050">22.05 kHz</option>
                <option value="44100">44.1 kHz</option>
                <option value="48000" selected>48 kHz (default)</option>
            </select>

            <label for="channels">Channels</label>
            <select id="channels">
                <option value="1">Mono</option>
                <option value="2" selected>Stereo</option>
            </select>

            <label for="timeslice">Chunk interval</label>
            <select id="timeslice">
                <option value="100" selected>100 ms</option>
                <option value="150">150 ms</option>
                <option value="250">250 ms</option>
                <option value="500">500 ms</option>
                <option value="1000">1000 ms</option>
            </select>
        </div>
    </details>

    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop</button>

    <div id="muteControls">
        <label><input type="checkbox" id="muteMic"> 🔇 Mute mic</label>
        <label><input type="checkbox" id="muteSpeakers"> 🔇 Mute speakers</label>
    </div>

    <div id="status">Waiting for action...</div>

    <div id="meters">
        <div class="meter">
            <span class="meter-label">🎤 Local</span>
            <div class="meter-track">
                <div class="meter-fill" id="localMeter"></div>
            </div>
        </div>
        <div class="meter">
            <span class="meter-label">🔊 Remote</span>
            <div class="meter-track">
                <div class="meter-fill meter-fill--remote" id="remoteMeter"></div>
            </div>
        </div>
    </div>

    <div id="stats">
        <span>⬆ Sent: <strong id="sentRate">0 KB/s</strong></span>
        <span>⬇ Recv: <strong id="recvRate">0 KB/s</strong></span>
    </div>

    <div id="remoteAudioContainer" style="display:none"></div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
